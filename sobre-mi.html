<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sobre mí · Bodas Con Cati</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f2ec;
      color: #403936;
    }

    a {
      text-decoration: none;
      color: inherit;
    }


    /* =====================================
       HEADER
    ===================================== */

    header {
      height: 125px;

      padding: 0 5vw;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #f7f2ec;

      position: relative;
      z-index: 10;
    }


    /* LOGO */

    .logo {
      width: 260px;
      height: auto;
      display: block;
    }


    /* MENÚ */

    nav {
      display: flex;
      align-items: center;
      gap: 43px;
    }


    nav a {
      font-size: 18px;
      font-weight: 500;

      letter-spacing: 1.8px;

      color: #514a45;

      transition: color 0.3s ease;
    }


    nav a:hover {
      color: #a4776b;
    }


    nav a.active {
      color: #9b6f63;
    }



    /* =====================================
       SOBRE MÍ
    ===================================== */

    .about-hero {

      display: grid;

      grid-template-columns: 42% 58%;

      min-height: calc(100vh - 125px);

    }



    /* =====================================
       COLUMNA IZQUIERDA
    ===================================== */

    .about-text {

      padding: 70px 6vw 90px 5vw;

      display: flex;

      flex-direction: column;

      justify-content: center;

    }


    .about-eyebrow {

      font-size: 15px;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: #9b6f63;

      margin-bottom: 28px;

    }


    .about-title {

      font-family: Georgia, "Times New Roman", serif;

      font-weight: normal;

      font-size: clamp(68px, 5.4vw, 92px);

      line-height: 0.95;

      letter-spacing: -3.5px;

      color: #403936;

      margin-bottom: 32px;

    }


    .about-title em {

      color: #a4776b;

      font-style: italic;

    }



    /* =====================================
       LÍNEA
    ===================================== */

    .about-line {

      width: 65px;

      height: 1px;

      background: #9b6f63;

      margin-bottom: 32px;

    }



    /* =====================================
       TEXTO
    ===================================== */

    .about-text p {

      font-family: Georgia, "Times New Roman", serif;

      font-size: 25px;

      line-height: 1.55;

      color: #514a45;

      margin-bottom: 26px;

    }


    .about-text p strong {

      font-weight: normal;

      font-style: italic;

      color: #8f675d;

    }



    /* =====================================
       FIRMA
    ===================================== */

    .signature {

      font-family: Georgia, "Times New Roman", serif;

      font-style: italic;

      font-size: 58px;

      color: #9b6f63;

      margin-top: 22px;

    }



    /* =====================================
       FOTO
    ===================================== */

    .about-photo {

      position: relative;

      min-height: calc(100vh - 125px);

      overflow: hidden;

      background: #ddd;

    }


    .about-photo img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center;

      display: block;

    }



    /* =====================================
       FRASE SOBRE LA FOTO
    ===================================== */

    .photo-quote {

      position: absolute;

      left: 45px;
      right: 45px;
      bottom: 45px;

      padding: 32px 38px;

      background: rgba(247, 242, 236, 0.94);

      max-width: 700px;

    }


    .photo-quote p {

      font-family: Georgia, "Times New Roman", serif;

      font-style: italic;

      font-size: 27px;

      line-height: 1.35;

      color: #76574f;

    }



    /* =====================================
       CIERRE
    ===================================== */

    .closing {

      padding: 95px 30px 110px;

      text-align: center;

      background: #eee3da;

    }


    .closing p {

      font-family: Georgia, "Times New Roman", serif;

      font-style: italic;

      font-size: clamp(42px, 4.2vw, 64px);

      line-height: 1.2;

      color: #8f675d;

      max-width: 1050px;

      margin: 0 auto;

    }



    /* =====================================
       FOOTER
    ===================================== */

    footer {

      padding: 35px 20px;

      text-align: center;

      background: #f7f2ec;

      border-top: 1px solid rgba(100,80,70,0.15);

      color: #766e68;

      font-size: 13px;

      letter-spacing: 1.5px;

    }

       TABLET
    ===================================== */

      header {
        padding: 0 30px;
      }


      .logo {
        width: 230px;
      }

        gap: 25px;
      }

        font-size: 16px;
      }

      }

        font-size: 54px;
